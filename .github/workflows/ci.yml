name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/*.test.mjs
      - run: node tools/build-palette-data.mjs
      - run: git diff --exit-code data/palette/palettes.json
      - run: node tools/standalone.mjs
      - run: pwsh -File .github/scripts/Test-NoEmDash.ps1
